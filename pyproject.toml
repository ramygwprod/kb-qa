[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbqa"
version = "1.0.0"
description = "Validation gates for evidence-grounded data collection"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kbqa = "kbqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
