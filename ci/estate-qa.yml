# Template — copy to the ESTATE repo as .github/workflows/qa.yml
#
# This is where level 4 actually bites.
#
# kb-qa's own CI proves the gates still fail correctly. THIS workflow runs those
# gates against real vendor data on every push to the estate — from a PINNED
# kbqa version the collecting agent cannot edit, on a machine it cannot reach.
#
# ⚠ READ THIS BEFORE TRUSTING A GREEN RUN
#
# On a FREE GitHub plan a PRIVATE repo cannot enforce rulesets, so this workflow
# REPORTS BUT DOES NOT BLOCK. A red run here does not stop a merge or a push.
# That is a plan limitation, not a configuration mistake, and it means the
# estate sits at level 3½ in the spec's §0 table — tamper-evident, not
# tamper-proof.
#
# §0 permits that, with a condition attached: levels 1–3 "make tampering
# visible and inconvenient, which is enough WHEN A HUMAN READS THE VERDICTS."
# The whole design rests on that clause here. Three things support it:
#
#   1. `@v6.1.0` below is a TAG, not a branch. The gates cannot be changed in
#      the same push as the data they judge.
#   2. G6 reports batches that were never checked, or checked and then edited.
#      Skipping the gates is therefore visible after the fact — and that check
#      lives inside the pinned gates, so it cannot be edited away by whoever
#      skipped it.
#   3. ci/estate-pre-push refuses a push on a failing sweep. Bypassable with
#      --no-verify, which is the point: it makes skipping deliberate.
#
# To get real enforcement: GitHub Team (~$4/user/mo), or make the estate public
# (do not), or host it where private repos get protected branches for free.

name: qa

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kbqa from a pinned tag
        # No token: kb-qa is public, so this needs no credential and the estate
        # repo needs no secret. The estate itself stays private — only the
        # validator is published.
        run: |
          pip install --upgrade pip
          pip install "git+https://github.com/ramygwprod/kb-qa.git@v6.1.0"
          python -m kbqa --manifest

      - name: Estate-wide integrity (G6)
        # Writes a job summary as well as failing, because an unenforced red X
        # is easy to scroll past. The summary is the first thing on the run page.
        run: |
          set +e
          python -m kbqa g6 --root . > g6.json
          code=$?
          set -e
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("g6.json"))
          c = d.get("counts", {})
          ok = d.get("verdict") == "PASS"
          print(f"## Estate integrity — {'PASS' if ok else 'FAIL'}")
          print()
          print("| | |")
          print("|---|---|")
          print(f"| staging files | {c.get('staging_files', '?')} |")
          print(f"| **never checked** | **{c.get('batches_unchecked', '?')}** |")
          print(f"| checked then edited | {c.get('batches_stale', '?')} |")
          print(f"| known failing | {c.get('batches_known_failing', '?')} |")
          print(f"| feature trees | {c.get('feature_trees', '?')} |")
          print()
          if not ok:
              print("> This run does **not** block the push — a private repo on a free")
              print("> plan cannot require a status check. It is evidence, and it only")
              print("> works if it is read.")
              print()
              seen = set()
              for f in d.get("findings", [])[:12]:
                  if f["code"] in seen:
                      continue
                  seen.add(f["code"])
                  print(f"- `{f['code']}` — {f['message'][:160]}")
          PY
          exit $code

      - name: Per-batch gates (G1, G2, G3)
        run: |
          set -euo pipefail
          failed=0
          shopt -s nullglob globstar
          # Recursive: estates nest vendors under a container directory whose
          # name varies. Hardcoding `Competitors/` silently checked nothing when
          # the tree was laid out any other way — and a sweep that matches no
          # files looks identical to a clean estate.
          for staging in **/_collect-*-staging.md; do
            vendor_dir="$(dirname "$staging")"
            base="$(basename "$staging")"
            batch="${base#_collect-}"; batch="${batch%-staging.md}"
            capture="$vendor_dir/_capture-${batch}.raw.txt"

            echo "::group::$vendor_dir  batch=$batch"
            for gate in \
              "g1 --staging $staging --capture $capture" \
              "g2 --staging $staging" \
              "g3 --staging $staging --capture $capture"
            do
              # shellcheck disable=SC2086
              if ! python -m kbqa $gate > /dev/null; then
                echo "::error file=$staging::${gate%% *} FAILED for $vendor_dir/$batch"
                # shellcheck disable=SC2086
                python -m kbqa $gate || true
                failed=1
              fi
            done
            echo "::endgroup::"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more gates failed"
            exit 1
          fi

          # An empty sweep is not a pass. If the glob matched nothing, the
          # discovery pattern is wrong and every batch went unchecked.
          count=$(ls **/_collect-*-staging.md 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no staging files discovered — the sweep checked nothing"
            exit 1
          fi
          echo "checked $count batches"
